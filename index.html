<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Game Gauntlet</title>
    <link href="css/styles.css" rel="stylesheet">
    <link href="css/tab1.css" rel="stylesheet">
    <link href="css/tab2.css" rel="stylesheet">
    <link href="css/tab3.css" rel="stylesheet">
    <link href="css/tab4.css" rel="stylesheet">
    <link href="css/tab0.css" rel="stylesheet">
</head>
<body>
<button id="theme-toggle">Сменить тему</button>

<div class="tabs">
    <button class="tab-button" data-tab="tab0">Крутилка</button>
    <button class="tab-button active" data-tab="tab1">Поиск</button>
    <button class="tab-button" data-tab="tab2">Зал славы</button>
    <button class="tab-button" data-tab="tab3">Достижения</button>
    <button class="tab-button" data-tab="tab4">Библиотека</button>
</div>

<div class="tab-content" id="tab0">
    <div class="wheel-container">
        <!-- Блок, куда п5 вставит <canvas> -->
        <div id="wheel-canvas"></div>

        <div class="wheel-controls">
            <div class="wheel-buttons">
                <button class="wheel-btn" data-wheel="default">Колесо балдежа</button>
                <button class="wheel-btn" data-wheel="shame">Колесо говна</button>
                <button class="wheel-btn" data-wheel="super_shame">Колесо супер говна</button>
            </div>
            <div class="last-selected">
                <span id="last-selected-text"></span>
                <img id="copy-last-selected"
                     title="Скопировать последний выпавший пункт"
                     src="resources/wheel/page_white_paste_table.png"/>
            </div>
        </div>
    </div>
</div>

<div class="tab-content active" id="tab1">
    <div class="search-container">
        <label for="search-input"></label><input id="search-input" placeholder="Название игры" type="text">
        <ul id="suggestions-list"></ul>
    </div>

    <div class="info-blocks">
        <div class="info-block" id="info-block1">
            <h2>INFO</h2>
            <p>Информация отобразиться тут.</p>
        </div>
        <div class="info-block" id="info-block2">
            <h2>Steam Reviews</h2>
            <p>Информация отобразиться тут.</p>
        </div>
        <div class="info-block" id="info-block3">
            <h2>Metacritic Review</h2>
            <p>Информация отобразиться тут.</p>
        </div>
        <div class="info-block" id="info-block4">
            <h2>HowLongToBeat</h2>
            <p>Информация отобразиться тут.</p>
        </div>
    </div>

    <div class="calculator">
        <h2>Calculator</h2>
        <label for="hours">Часов:</label>
        <input id="hours" type="text">
        <label for="category1">Категория:</label>
        <select id="category1">
            <option value="1.1">AAA 2010+</option>
            <option value="1.2">Indie and B-class</option>
            <option value="1.3">2010 and older</option>
        </select>
        <label for="category2">Оценка:</label>
        <select id="category2">
            <option value="1.1">0-50</option>
            <option value="1.15">50-75</option>
            <option value="1.2">75-100</option>
        </select>
        <label for="result">Результат:</label>
        <input id="result" readonly type="text">
    </div>
</div>

<div class="tab-content" id="tab2">
    <div class="event-panel" id="current-event">
    </div>
    <div class="event-panel" id="past-events">
    </div>
</div>


<div class="tab-content" id="tab3">
    <h2>Загрузка данных...</h2>
</div>

<div class="tab-content" id="tab4">
    <h2>Загрузка данных...</h2>
</div>

<script src="js/main.js" type="module"></script>
<script src="js/Wheel/p5.min.js"></script>
<script src="js/Wheel/WheelSketch.js"></script>
<script type="module" src="js/tab0.js"></script>
</body>
</html>
